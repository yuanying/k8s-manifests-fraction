# Based on deploy/ of github.com/yuanying/cnidaria-cni. The NodeNetworkPolicy CRD is
# rendered separately into manifests/crds/cnidaria/crds.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnidaria
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cnidaria
---
# The daemon reads what it renders and writes back only NodeNetworkPolicy status and
# one annotation on its own Node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, patch]
- apiGroups: [""]
  resources: [pods, namespaces]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch]
- apiGroups: [cnidaria.unstable.cloud]
  resources: [nodenetworkpolicies]
  verbs: [get, list, watch]
- apiGroups: [cnidaria.unstable.cloud]
  resources: [nodenetworkpolicies/status]
  verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnidaria
subjects:
- kind: ServiceAccount
  name: cnidaria
  namespace: kube-system
---
# One daemon per node in the host's network namespace. It writes the CNI conflist,
# keeps the host-gw routes and applies the nftables table. Pod CIDRs are read from
# node.spec.podCIDRs, so nothing here depends on kubernetes.networking.pod_subnet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cnidaria
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cnidaria
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cnidaria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnidaria
    spec:
      hostNetwork: true
      # The pod network depends on this daemon, so it has to run on every node,
      # whatever taints the node carries. A node without a CNI config is NotReady
      # and tainted node.kubernetes.io/not-ready:NoSchedule; not tolerating that
      # leaves the node waiting for a daemon that can never be scheduled.
      tolerations:
      - operator: Exists
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: cnidaria
      # cnidaria has no CNI binary of its own, and this DaemonSet does not touch
      # /opt/cni/bin. The reference plugins its conflist names (bridge, host-local,
      # portmap) and the loopback that containerd calls are put there by
      # `porkadot install kubelet` (kubernetes.networking.cni_version).
      containers:
      - name: cnidaria
        image: ghcr.io/yuanying/cnidaria-cni:v0.1.1
        args:
        - --proc-sys=/host/proc/sys
        - --network-name=cbr0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: false
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN, NET_RAW]
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            port: 19080
            path: /healthz
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            host: 127.0.0.1
            port: 19080
            path: /readyz
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: cni-conf
          mountPath: /etc/cni/net.d
        - name: proc-sys-net
          mountPath: /host/proc/sys/net
        - name: xtables-lock
          mountPath: /run/xtables.lock
      volumes:
      - name: cni-conf
        hostPath:
          path: /etc/cni/net.d
          type: DirectoryOrCreate
      - name: proc-sys-net
        hostPath:
          path: /proc/sys/net
          type: Directory
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
