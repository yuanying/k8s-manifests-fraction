---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bds
spec:
  template:
    spec:
      tolerations:
      - effect: NoSchedule
        key: vm-exclusive
        operator: Exists
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      # storageClassName: bronze
      # accessModes:
      #   - ReadWriteOnce
      # resources:
      #   requests:
      #     storage: 10Gi
      storageClassName: manual
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      selector:
        matchLabels:
          use: "minecraft"
