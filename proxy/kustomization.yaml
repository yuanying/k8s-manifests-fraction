commonLabels:
  region: fraction
  app: proxy
namespace: proxy
resources:
- proxy.yaml
- code.yaml

generatorOptions:
  disableNameSuffixHash: true

# BASIC 認証の Secret（basic-auth）はもう作らない。ingress-nginx が読んでいたもので、
# gated に移ってからは NetworkRole が認可を担う。Ingress 側の auth-* アノテーションは
# 記録として残しているが、Secret を指す先はもう無い。
